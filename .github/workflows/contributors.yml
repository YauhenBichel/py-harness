name: Contributors

# Fills the README contributors wall from the GitHub contributors API (commit
# order, bots omitted) and commits it straight to main — no separate pull
# request. Names are never hardcoded; a stale hand-written list is worse than
# none.
#
# It runs after every push to main, weekly, and by hand, and only ever on main.
# It used to run on pull requests and refresh the PR branch, then open a
# docs/contributors pull request for main. That shape lost people: a fork's
# pull request cannot run it, and a same-repository branch lands a wall
# computed before anything that merged ahead of it. A run on main after the
# merge sees every commit.
#
# main is protected, so the push goes through a write deploy key stored as
# CONTRIBUTORS_DEPLOY_KEY, the one bypass actor on the main ruleset besides the
# owner. A deploy-key push starts workflows, so the commit carries the skip-ci
# marker and neither CI nor this job runs again for a README-only change.
#
# One guard survives from the pull request days, because it is the reason a
# person used to read the refresh: a name should never leave the wall, and if
# one would, the contributors API most likely answered short. An automatic run
# that would remove a name does not push; it says so and stops. A run started
# by hand is a person saying the removal is real, and it pushes.

on:
  push:
    branches:
      - main
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

# The push uses the deploy key; the token only reads the contributors API.
permissions:
  contents: read

concurrency:
  group: contributors
  cancel-in-progress: true

jobs:
  readme:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Always main, whatever the run started from. Named rather than read from
      # github.event.repository, which a scheduled run's payload does not carry.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          ssh-key: ${{ secrets.CONTRIBUTORS_DEPLOY_KEY }}
          persist-credentials: true

      - name: Fill README contributors
        uses: YauhenBichel/readme-contributors@25e0b067b5edec34206283138657dc8a8713d89a # reuse captions
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          format: html

      - name: Commit the wall to main
        env:
          STARTED_BY_HAND: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md .github/faces
          if git diff --cached --quiet; then
            echo "The wall already matches the contributors API."
            exit 0
          fi

          REMOVED=$(git diff --cached -U0 -- README.md \
            | grep -cE '^-.*href="https://github.com/' || true)
          if [ "$REMOVED" -gt 0 ] && [ "$STARTED_BY_HAND" != "true" ]; then
            echo "::warning::This refresh would remove $REMOVED name(s) from the wall. A name should not leave it; the contributors API most likely answered short. Nothing was pushed. If the removal is real, run this workflow by hand to accept it."
            exit 0
          fi

          added=$(git diff --cached --name-only --diff-filter=A -- .github/faces \
            | sed 's#.*/##; s#\.svg$##' | paste -sd, - | sed 's/,/, /g')
          git commit -m "docs: refresh README contributors${added:+ (adds $added)} [skip ci]"

          # main can move while this runs; the commit only touches the wall,
          # which was just recomputed, so replaying it on the new tip is safe.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Wall updated on main${added:+: added $added}."
              exit 0
            fi
            if ! git pull --rebase origin main; then
              git rebase --abort || true
              echo "::error::main changed the wall's files while this ran; the next run will recompute it."
              exit 1
            fi
          done
          echo "::error::Could not push to main. Check CONTRIBUTORS_DEPLOY_KEY is a write deploy key and that deploy keys may bypass the main ruleset."
          exit 1
