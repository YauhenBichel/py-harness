name: CI

on:
  push:
    branches: [main]
  pull_request:

# This matrix is nine jobs across three operating systems, and it was running
# twice for every push to a branch with a pull request open: once for the push
# event, once for the pull request event, on the same commit. Restricting push
# to main leaves exactly one run per change.
#
# Cancelling only applies to pull requests, so a push to main is never killed
# part-way through.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}

      # The harness uses only the standard library, so this installs the
      # package and its console script and nothing else.
      - name: Install
        run: python -m pip install -e .

      - name: Harness tests (no GPU, no tokens)
        run: python -m unittest discover -s tests -q

      - name: Everyday eval gate (offline)
        run: python scripts/measure/eval_everyday.py

      # Proves the command works with no PYTHONPATH and no repository paths.
      - name: Installed command
        run: |
          py-harness --help
          py-harness brief .
          py-harness layout .
