name: Celebrate merge
on:
  pull_request_target:
    types: [closed]
permissions:
  pull-requests: write
jobs:
  celebrate:
    if: github.event.pull_request.merged && github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      # Pinned to a commit, not the tag. This job runs on
      # `pull_request_target` with `pull-requests: write`, so it has the
      # repository's token on a pull request from anyone. A tag can be
      # moved; a commit cannot.
      - uses: YauhenBichel/merge-cheer@9b25f23fe544b07d1d03860181886dc1831f6c99 # v1.6.0
