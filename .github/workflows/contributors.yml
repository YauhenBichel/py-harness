name: Contributors

# Fills the README markers from the GitHub contributors API
# (commit order, bots omitted). Do not hardcode names or counts.
#
# Does not open a pull request. Protected main refuses both a
# GITHUB_TOKEN push and "Actions may create PRs" (that setting is
# off). Same-repo PR / feature branches get the commit in place.
# A fork PR is skipped outright. Nothing here can work on one: the
# branch lives on the fork, so the checkout cannot fetch it, and there
# is nowhere to push if it could. The contributor is not in the API
# until merge either. It used to run anyway and fail while fetching a
# ref this repository does not have.
#
# main takes changes only through a reviewed pull request, so this
# cannot commit there. It used to force-push the refresh to a branch
# called docs/contributors and stop, and nothing merged that branch, so
# the list never actually reached the README. It opens a pull request
# now: still one click to land, but visible and landable.

# `push` is limited to the default branch on purpose. A feature branch
# fires both events for the same ref, both resolve `github.head_ref ||
# github.ref_name` to that same branch, and both do identical work — so
# the concurrency group below cancels one of them and the pull request
# shows a red X that means nothing. It hit three branches in one evening.
# The pull_request run covers a branch; this covers main.
on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: contributors-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  readme:
    if: >-
      github.actor != 'github-actions[bot]'
      && (github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          persist-credentials: true

      - name: Fill README contributors
        uses: YauhenBichel/readme-contributors@25e0b067b5edec34206283138657dc8a8713d89a # reuse captions
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          format: html

      # The job only runs where a push is possible, so this needs no
      # condition of its own.
      - name: Push the list on a writable branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md .github/faces
          git diff --cached --quiet && exit 0
          # A refresh should only ever add people. A name disappearing
          # means the API answered short — a rate limit, a transient
          # failure — not that someone stopped being a contributor. That
          # has happened: a hand-run refresh in a pull request removed
          # four. Additions merge themselves; a removal waits for a
          # person.
          REMOVED=$(git diff --cached -U0 -- README.md \
            | grep -cE '^-.*href="https://github.com/' || true)
          git commit -m "docs: refresh README contributors"
          if [ "$BRANCH" != "$DEFAULT_BRANCH" ]; then
            # A branch of this repository takes the commit in place.
            git push
            exit 0
          fi
          # main is review-only, so offer the refresh as a pull request.
          git checkout -B docs/contributors
          git push --force --set-upstream origin docs/contributors
          NUMBER="$(gh pr list --head docs/contributors --state open --json number -q '.[0].number')"
          if [ -z "$NUMBER" ]; then
            if [ "$REMOVED" -gt 0 ]; then
              NOTE="This refresh removes $REMOVED name(s), so it is left for a person to read. A name should not disappear from this list; if one has, the contributors API most likely answered short."
            else
              NOTE="Additions only, so this merges itself once the checks pass."
            fi
            NUMBER="$(gh pr create --base "$DEFAULT_BRANCH" --head docs/contributors \
              --title "docs: refresh README contributors" \
              --body "The contributors list changed. Filled from the GitHub contributors API, bots omitted. Opened by the Contributors workflow because main takes changes only through a pull request.

          $NOTE" | grep -o '[0-9]*$')"
          fi
          if [ "$REMOVED" -eq 0 ] && [ -n "$NUMBER" ]; then
            # Adding a name to a generated table is not a change anybody
            # needs to read. Auto-merge still waits for the checks.
            gh pr merge "$NUMBER" --auto --squash || \
              echo "auto-merge not enabled; leaving #$NUMBER for a person"
          fi
