version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # Actions are pinned by commit, so this is the only thing that moves them.
    # Grouped, so a month of digest bumps is one pull request rather than six.
    groups:
      actions:
        patterns: ['*']
