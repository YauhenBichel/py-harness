name: Pages

# The default Actions token cannot create a Pages site. One-time, in a browser:
# https://github.com/YauhenBichel/py-harness/settings/pages
# Build and deployment → Source → GitHub Actions.
# Then re-run this workflow.

on:
  push:
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Publish from the default branch, whatever it is called. `deploy` only
    # needs `build`, so this is the single place that decides what may
    # replace the published site. Naming the branch here meant the rename to
    # main silently stopped the site updating.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
        id: pages
      - name: Explain a Setup Pages failure
        if: failure() && steps.pages.outcome == 'failure'
        run: |
          echo "Setup Pages failed. Open"
          echo "https://github.com/${GITHUB_REPOSITORY}/settings/pages"
          echo "and set Build and deployment -> Source -> GitHub Actions."
          echo "GITHUB_TOKEN cannot create the site itself."
      - uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1
        with:
          source: ./docs
          destination: ./_site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
