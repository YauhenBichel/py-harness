name: release

# Publishing a GitHub release puts that version on PyPI.
# PyPI trusts this workflow through OIDC (a trusted publisher), so no token is
# stored anywhere. The tag must match the version in pyproject.toml.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"

      - name: The tag matches the version in pyproject.toml
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "v$version" = "$GITHUB_REF_NAME" || { echo "::error::tag $GITHUB_REF_NAME, pyproject $version"; exit 1; }

      - name: Harness tests (no GPU, no tokens)
        run: |
          python -m pip install -e .
          python -m unittest discover -s tests -q

      # Wheel only, as for 0.3.1: the sdist does not yet carry kit_build.py,
      # so a wheel cannot be built from it.
      - name: Build the wheel
        run: |
          python -m pip install build==1.4.4
          python -m build --wheel

      - name: The wheel installs and its command runs
        run: |
          python -m venv /tmp/wheel-check
          /tmp/wheel-check/bin/pip install dist/*.whl
          cd /tmp && /tmp/wheel-check/bin/py-harness --help

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/py-harness-cli/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
